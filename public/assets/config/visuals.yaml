background:
  color: [10, 10, 20]
  star_count: 300
  parallax_range: [0.02, 0.08]

camera:
  default_zoom: 0.8

particles:
  min_render_size: 2      # pixels
  mass_threshold_circle: 500  # above this mass, render as circle instead of rect

trails:
  speed_threshold: 50
  max_length: 4
  color: [150, 180, 255]

ship_marker:
  ring_radii: [20, 30]
  pulse_hz: 4.0
  color: [100, 200, 255]

star:
  corona_layers: 5
  corona_colors: [[255,180,80],[255,192,96],[255,210,128],[255,230,176],[255,240,208]]
  corona_alphas: [0.03, 0.04, 0.06, 0.08, 0.12]
  surface_spots: 6

blackhole:
  accretion_rings: 4
  accretion_colors: [[255,96,32],[255,128,64],[255,160,96],[255,192,128]]
  photon_ring_color: [170, 204, 255]
  photon_ring_alpha: 0.4

hud:
  font: '14px monospace'
  speed_max: 300
  temp_max: 500

shaders:
  star_surface:
    enabled: false
    glsl: |
      finalColor = vec4(1.0, 0.2, 0.1, 1.0);
      float angle = atan(delta.y, delta.x);
      float flare = pow(max(0.0, sin(angle * 3.0 + uTime * 2.0)), 8.0);
      flare *= smoothstep(1.5, 1.0, normDist) * smoothstep(0.8, 1.0, normDist);
      color += vec3(1.0, 0.5, 0.1) * flare * 0.5;
      alpha = max(alpha, flare * 0.3);
      finalColor = mix(bg, vec4(color, 1.0), alpha);

  blackhole_lensing:
    enabled: false
    glsl: |
      vec2 lensedUV = vTextureCoord;
      if (normDist < 5.0 && normDist > 0.1) {
        float strength = uRadius * uRadius / (dist * dist);
        lensedUV += normalize(delta) * strength * 0.002;
      }
      vec4 lensedBg = texture(uTexture, lensedUV);
      if (normDist < 1.0) {
        finalColor = vec4(0.0, 0.0, 0.0, 1.0);
      } else {
        float ring = smoothstep(1.0, 1.5, normDist) * smoothstep(2.0, 1.5, normDist);
        ring *= 0.5 + 0.5 * sin(atan(delta.y, delta.x) * 2.0 + uTime * 3.0);
        float diskAngle = abs(delta.y) / max(1.0, dist);
        float disk = smoothstep(0.3, 0.0, diskAngle) * smoothstep(1.0, 2.0, normDist) * smoothstep(4.0, 2.0, normDist);
        disk *= 0.7 + 0.3 * sin(dist * 0.1 + uTime * 5.0);
        vec3 ringColor = vec3(0.8, 0.9, 1.0) * ring;
        vec3 diskColor = vec3(1.0, 0.6, 0.2) * disk;
        float darken = smoothstep(1.0, 2.0, normDist);
        finalColor = vec4(lensedBg.rgb * darken + ringColor + diskColor, 1.0);
      }

cell_rendering:
  IRON:
    edge_color: [220, 220, 240]
    edge_width: 0.15
    shine: 0.3
  FUEL:
    pulse: true
    pulse_hz: 1.5
  EMITTER:
    directional_glow: true
    glow_color: [255, 200, 100]
  COCKPIT:
    window: true
  EXPLOSIVE:
    edge_color: [255, 100, 100]
    pulse: true
    pulse_hz: 0.8
